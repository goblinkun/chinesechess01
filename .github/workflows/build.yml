name: Build & Package

# 首次推送到 GitHub 后，在 Actions 页手动触发（workflow_dispatch），
# 或打 tag（v*）后自动触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Qt 6.9.3 是最后一个仍使用旧版仓库布局的 LTS 版本，
      # aqtinstall 目前能稳定安装；6.10+ 的 Windows 布局 aqt 尚不兼容。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Build engine (Pikafish)
        run: |
          cd Pikafish/src
          make -j"$(sysctl -n hw.logicalcpu)" build

      - name: Configure app
        run: |
          cmake -S ChineseChess -B ChineseChess/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_DEPLOY=ON

      - name: Build app
        run: cmake --build ChineseChess/build -j"$(sysctl -n hw.logicalcpu)"

      - name: Bundle engine into .app
        run: |
          APP="ChineseChess/bin/ChineseChess.app/Contents/MacOS"
          mkdir -p "$APP/engine"
          cp Pikafish/src/pikafish      "$APP/engine/"
          cp Pikafish/src/pikafish.nnue "$APP/engine/"

      - name: Deploy Qt runtime (macdeployqt)
        run: macdeployqt ChineseChess/bin/ChineseChess.app -always-overwrite

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - ChineseChess/bin/ChineseChess.app

      - name: Package DMG
        run: |
          rm -rf staging release
          mkdir -p staging release
          cp -R ChineseChess/bin/ChineseChess.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "ChineseChess" \
            -srcfolder staging -ov -format UDZO \
            release/ChineseChess-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChess-macos-arm64
          path: release/*.dmg

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # 引擎用 MSYS2 的 MinGW-w64 编译成独立 .exe（Makefile 会加 -static）
      - name: Setup MSYS2 (for engine)
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            mingw-w64-x86_64-gcc
            make
            curl

      # 指定 avx2 而非 native：云端 runner 支持 AVX512，
      # 用 native 编出的 exe 在普通用户机器上会因非法指令崩溃。
      - name: Build engine (Pikafish)
        shell: msys2 {0}
        run: |
          cd Pikafish/src
          make -j"$(nproc)" ARCH=x86-64-avx2 build

      - name: Configure app (Visual Studio)
        run: cmake -S ChineseChess -B ChineseChess/build -A x64 -DSKIP_DEPLOY=ON

      - name: Build app
        run: cmake --build ChineseChess/build --config Release

      # CMakeLists 已把 RUNTIME_OUTPUT_DIRECTORY_RELEASE 固定为 ChineseChess/bin
      - name: Bundle engine
        shell: pwsh
        run: |
          $bin = "ChineseChess/bin"
          New-Item -ItemType Directory -Force -Path "$bin/engine" | Out-Null
          Copy-Item "Pikafish/src/pikafish.exe"  "$bin/engine/"
          Copy-Item "Pikafish/src/pikafish.nnue" "$bin/engine/"
          Get-ChildItem $bin | Select-Object Name

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime --no-translations `
            "ChineseChess/bin/ChineseChess.exe"

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "ChineseChess/bin/*" `
            -DestinationPath "release/ChineseChess-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChess-windows-x64
          path: release/*.zip
